    label: Qualifying draw in Cairo
    detail: 48 teams drawn into 12 groups. Kenya drawn in Group D with South Africa, Guinea and Eritrea.
  - date: 2026-09-26
    label: Kenya 1-1 Eritrea
    detail: Qualifier at Nyayo National Stadium. Ryan Ogam equalised in the 87th minute.
    kenya: true
  - date: 2026-10-01
    label: Guinea v Kenya
    detail: Qualifier in Conakry.
    kenya: true
  - date: 2026-11-11
    label: Kenya v South Africa
    detail: Qualifier in Nairobi. Venue to be confirmed.
    kenya: true
  - date: 2026-11-17
    label: November window closes
    detail: Matchdays 3 and 4 of qualifying end.
  - date: 2027-03-22
    label: Final qualifying window opens
    detail: Matchdays 5 and 6, from 22 to 30 March 2027. The last qualifiers are decided.
  - date: 2027-03-30
    label: Qualifying ends
    detail: The 24 teams are known.
  - label: Final tournament draw
    detail: Groups for the finals. Date and venue to be announced by CAF.
    tbc: true
  - label: Ticket sales open
    detail: Through CAF's official channels. Date and prices to be announced.
    tbc: true
  - date: 2027-06-19
    label: Kick-off
    detail: The opening match. Venue to be confirmed by CAF.
  - date: 2027-07-17
    label: The final
    detail: Venue to be confirmed by CAF.

