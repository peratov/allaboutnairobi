# =============================================================================
# AFCON 2027 - the TotalEnergies CAF Africa Cup of Nations PAMOJA 2027.
#
# The hub page (/afcon), the AFCON tools and the AFCON guides all read this
# file, so a date or a capacity is typed once. Rules, as in constants.yaml:
#
#   * Only what CAF, FKF or the host governments have announced, or what
#     several reputable reports agree on, goes in as fact.
#   * Anything not yet decided (the draw, ticket prices, which stadium hosts
#     the opening match or final) is marked `tbc: true` and says so on the page.
#     Never invent a date or a price.
#   * `checked_on` is the day a human last compared this file with the sources.
# =============================================================================

meta:
  checked_on: 2026-09-28
  name: TotalEnergies CAF Africa Cup of Nations PAMOJA 2027
  short_name: AFCON 2027
  pamoja: Pamoja means "together" in Kiswahili - the name of the joint Kenya, Uganda and Tanzania bid.
  starts: 2027-06-19
  ends: 2027-07-17
  teams: 24
  matches: 52
  host_countries: 3
  stadiums: 10
  host_cities: 7
  nairobi_stadiums: 3
  defending_champions: Morocco
  first_three_host: true
  last_odd_year: true
  firsts: >-
    The first AFCON hosted by three countries, and the first in the CECAFA
    region (East and Central Africa) since Ethiopia in 1976. It is also the
    last to be played in an odd-numbered year: from 2028 the tournament moves
    to a four-year cycle.

# -----------------------------------------------------------------------------
# Nairobi's three venues. `map_id` is the landmark id on /map.
# -----------------------------------------------------------------------------
nairobi_venues:

  - id: raila-odinga
    name: Raila Odinga International Stadium
    formerly: Talanta Stadium (Talanta Sports City)
    capacity: 60000
    kind: New build
    map_id: raila-odinga-international-stadium
    lat: -1.30521
    lon: 36.75092
    area: Jamhuri, off Ngong Road, about 10 km west of the CBD
    near: Jamhuri Park showground, Ngong Racecourse and Kibra
    status: >-
      Built from March 2024 by China Road and Bridge Corporation under the
      supervision of the KDF Engineering Department, at a reported cost of
      about KES 45.85 billion. Reported to be more than 90% complete in
      August 2026, with ICT, broadcast and spectator facilities being
      finished.
    highlights:
      - Kenya's largest stadium once complete
      - A roof shaped like the shield on Kenya's flag
      - 52 executive suites, solar panels and rainwater harvesting
      - A contender to stage the opening match or the final
    getting_there:
      - Ngong Road is the main approach; it is slow at peak times and will be busier on matchdays.
      - From Kilimani, Kileleshwa and Lavington it is a short ride; from Karen and Lang'ata use the Southern Bypass or Ngong Road.
      - Matatus run along Ngong Road from the CBD towards Karen and Ngong.
      - Expect road closures and drop-off zones set by the organisers on matchdays.

  - id: kasarani
    name: Moi International Sports Centre, Kasarani
    formerly: Kasarani Stadium
    capacity: 60000
    kind: Rebuilt
    map_id: kasarani-stadium
    lat: -1.22806
    lon: 36.89056
    area: Kasarani, off the Thika Superhighway, about 12 km north-east of the CBD
    near: Garden City, Thika Road Mall, Roysambu and USIU
    status: >-
      Closed in February 2026 for its second phase of upgrades. Works include
      a hybrid pitch, new drainage, fully replaced seating, a new canopy,
      2,000-lux floodlights, VAR facilities, big screens, new changing rooms
      and automated ticketing, taking capacity from about 48,000 to 60,000.
    highlights:
      - Kenya's national stadium for big matches since 1987
      - Hosted Kenya's CHAN 2024 matches, including the 1-0 win over Morocco
      - Two annex pitches for training
    getting_there:
      - The Thika Superhighway is fast off-peak and slow at rush hour; the stadium exit jams after big matches.
      - Many matatus and buses run along Thika Road from the CBD.
      - Allow extra time for the walk from drop-off points to the gates.
      - During CHAN 2024, crowds without tickets forced their way in, and CAF cut the capacity for Kenya's matches. Arrive early and bring your ticket.

  - id: nyayo
    name: Nyayo National Stadium
    capacity: 30000
    kind: Renovated
    map_id: nyayo-national-stadium
    lat: -1.30419
    lon: 36.82447
    area: Where Lang'ata Road, Mombasa Road and Aerodrome Road meet, just south of the CBD
    near: The CBD, South B and South C, Madaraka and Nairobi West
    status: >-
      Renovated with a new canopy, lighting and track, and used for CHAN 2024
      (at about 18,000 seats) and for Kenya's AFCON 2027 qualifier against
      Eritrea in September 2026. Listed with 30,000 seats for AFCON 2027.
    highlights:
      - The most central of the three venues
      - Walkable from parts of the CBD, South B and Madaraka
      - Close to the Expressway and Mombasa Road
    getting_there:
      - The closest venue to the CBD - many fans can walk or take a short ride.
      - The Expressway and Mombasa Road pass right by; the junction is one of the busiest in Nairobi.
      - Matatus from the CBD towards Lang'ata and Mombasa Road pass the stadium.

