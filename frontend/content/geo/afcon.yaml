# Harambee Stars.
# -----------------------------------------------------------------------------
kenya:
  coach: Benni McCarthy
  coach_since: March 2025
  qualifying_group: D
  group_opponents: [South Africa, Guinea, Eritrea]
  qualified_as: Co-host - Kenya's place at the finals is guaranteed
  afcon_appearances: [1972, 1988, 1990, 1992, 2004, 2019]
  best_result: Kenya has never got past the group stage
  first_win: A 3-0 win over Burkina Faso in 2004
  chan_2024: >-
    At CHAN 2024, co-hosted with Uganda and Tanzania in August 2025, Kenya
    topped their group - including a 1-0 win over Morocco - and lost the
    quarter-final to Madagascar on penalties at Kasarani.

