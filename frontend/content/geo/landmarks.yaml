# =============================================================================
# Landmarks on /map
#
# Every coordinate here was geocoded against OpenStreetMap and checked to fall
# inside the Greater Accra bounding box, rather than remembered. Two places
# that belong on this list are missing because OSM has no record to point at -
# the W.E.B. Du Bois Memorial Centre and the Legon Botanical Gardens - and a
# guessed coordinate is worse than an absent one.
#
# `osm` is the name OpenStreetMap returned, kept so the next person can see
# what was actually matched. Coordinates and place data (c) OpenStreetMap
# contributors, ODbL.
#
# Run scripts/build_map_data.py after editing this.
# =============================================================================

