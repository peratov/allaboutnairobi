# Landmarks and neighbourhoods drawn on /map.
#
# Read by scripts/build_nairobi_map.py, which projects them into the map's
# coordinate space and writes templates/geo/nairobi-map.json. Edit here, then
# run `python scripts/build_nairobi_map.py` from frontend/.
#
# Coordinates come from Wikidata (P625) or, where Wikidata has none,
# OpenStreetMap via Nominatim. Checked 22 September 2026.

categories:
  nature: Parks and wildlife
  culture: Museums and culture
  government: Government
  transport: Transport
  shopping: Markets and malls
  education: Universities
  health: Hospitals
  faith: Places of worship
  sport: Sport

landmarks:
  # --- Parks and wildlife -------------------------------------------------
  - name: Nairobi National Park
    category: nature
    lat: -1.37333
    lon: 36.85889
    description: >-
      Kenya's first national park, gazetted in 1946. Lions, rhino and giraffe
      with the city skyline behind them. The main gate is on Lang'ata Road.
  - name: Karura Forest
    category: nature
    lat: -1.24028
    lon: 36.82361
    description: >-
      Roughly a thousand hectares of urban forest with walking, running and
      cycling trails and a waterfall. Managed by the Kenya Forest Service with
      Friends of Karura.
  - name: Uhuru Park
    category: nature
    lat: -1.29028
    lon: 36.81722
    description: >-
      Public park on the edge of the CBD, with a boating lake. Central Park is
      next door.
  - name: Nairobi Arboretum
    category: nature
    lat: -1.2743
    lon: 36.8131
    description: >-
      A tree park off State House Road, started in 1907 to trial tree species.
      Popular for picnics and early-morning runs.
  - name: City Park
    category: nature
    lat: -1.26365
    lon: 36.82997
    description: >-
      Forested public park between Parklands and Muthaiga, with walking paths
      and resident monkeys.
  - name: Ngong Road Forest
    category: nature
    lat: -1.31642
    lon: 36.7417
    description: >-
      Forest reserve between Ngong Road and Karen, with trails for walking,
      running and riding.
  - name: Giraffe Centre
    category: nature
    lat: -1.37612
    lon: 36.7461
    description: >-
      Run by the African Fund for Endangered Wildlife. Feed Rothschild's
      giraffes from a raised platform in Lang'ata.
  - name: Sheldrick Wildlife Trust
    category: nature
    lat: -1.37664
    lon: 36.7741
    description: >-
      Orphaned elephant nursery inside Nairobi National Park. Visitors come for
      a short daily viewing; book ahead.

  # --- Museums and culture ------------------------------------------------
  - name: Nairobi National Museum
    category: culture
    lat: -1.27389
    lon: 36.815
    description: >-
      On Museum Hill: Kenyan history, culture, art and natural history, with
      the Snake Park in the same grounds.
  - name: Karen Blixen Museum
    category: culture
    lat: -1.35197
    lon: 36.71251
    description: >-
      The farmhouse of Karen Blixen, author of Out of Africa, kept as a museum
      in Karen.
  - name: Bomas of Kenya
    category: culture
    lat: -1.33681
    lon: 36.76910
    description: >-
      Traditional homesteads of Kenya's communities and regular dance
      performances, off Lang'ata Road.
  - name: Nairobi Railway Museum
    category: culture
    lat: -1.29373
    lon: 36.82219
    description: >-
      Locomotives and carriages from the Uganda Railway era, beside the
      central station.
  - name: Kenya National Theatre
    category: culture
    lat: -1.27853
    lon: 36.81564
    description: >-
      Theatre on Harry Thuku Road, next to the University of Nairobi.
  - name: Kenya National Archives
    category: culture
    lat: -1.28489
    lon: 36.82594
    description: >-
      National records and a public gallery on Moi Avenue, facing the Hilton.
  - name: Nairobi Gallery
    category: culture
    lat: -1.28679
    lon: 36.81783
    description: >-
      Art gallery in the Old PC's Office at the corner of Kenyatta Avenue and
      Uhuru Highway.

  # --- Government ---------------------------------------------------------
  - name: Parliament Buildings
    category: government
    lat: -1.29003
    lon: 36.81981
    description: >-
      Seat of the National Assembly and the Senate, on Parliament Road.
  - name: KICC
    category: government
    lat: -1.28861
    lon: 36.82306
    description: >-
      The Kenyatta International Convention Centre. The cylindrical tower that
      defines the skyline, with a rooftop viewing deck.
  - name: City Hall
    category: government
    lat: -1.2869
    lon: 36.82175
    description: >-
      Seat of the Nairobi City County government, on City Hall Way.
  - name: Supreme Court
    category: government
    lat: -1.28749
    lon: 36.8231
    description: >-
      Kenya's highest court, on City Hall Way.
  - name: State House
    category: government
    lat: -1.28278
    lon: 36.80222
    description: >-
      The President's official residence. Not open to the public.
  - name: UN Office at Nairobi
    category: government
    lat: -1.23466
    lon: 36.8165
    description: >-
      UNON in Gigiri, headquarters of UNEP and UN-Habitat and the UN's main
      base in Africa.

  # --- Transport ----------------------------------------------------------
  - name: Jomo Kenyatta International Airport
    category: transport
    lat: -1.31861
    lon: 36.92583
    description: >-
      JKIA, Nairobi's main international airport, in Embakasi, south-east of
      the CBD.
  - name: Wilson Airport
    category: transport
    lat: -1.32
    lon: 36.815
    description: >-
      Domestic and light-aircraft airport on Lang'ata Road. Many safari flights
      to the Maasai Mara leave from here.
  - name: Nairobi Terminus (SGR)
    category: transport
    lat: -1.35456
    lon: 36.89843
    description: >-
      Where Madaraka Express trains to Mombasa leave from, near Syokimau.
  - name: Nairobi Central Station
    category: transport
    lat: -1.29166
    lon: 36.82862
    description: >-
      The old railway station at the edge of the CBD, hub of the Nairobi
      Commuter Rail network.

  # --- Markets and malls --------------------------------------------------
  - name: Gikomba Market
    category: shopping
    lat: -1.28639
    lon: 36.84139
    description: >-
      Huge open-air market, best known for mitumba - second-hand clothes. Go
      early, and keep your phone out of sight.
  - name: Toi Market
    category: shopping
    lat: -1.30713
    lon: 36.77945
    description: >-
      Second-hand clothes and household goods market beside Kibra.
  - name: Two Rivers Mall
    category: shopping
    lat: -1.21056
    lon: 36.79444
    description: >-
      One of the largest malls in East Africa, off Limuru Road.
  - name: Westgate
    category: shopping
    lat: -1.25678
    lon: 36.80319
    description: >-
      Shopping mall in Westlands, on Mwanzi Road.
  - name: Sarit Centre
    category: shopping
    lat: -1.26056
    lon: 36.80194
    description: >-
      Long-established Westlands mall with an exhibition centre.
  - name: Village Market
    category: shopping
    lat: -1.2288
    lon: 36.80504
    description: >-
      Open-air mall in Gigiri, near the UN offices and many embassies.
  - name: The Hub Karen
    category: shopping
    lat: -1.32032
    lon: 36.70378
    description: >-
      Mall in Karen, on Dagoretti Road.
  - name: Garden City Mall
    category: shopping
    lat: -1.23194
    lon: 36.87778
    description: >-
      Mall on Thika Road, in Kasarani.

  # --- Universities -------------------------------------------------------
  - name: University of Nairobi
    category: education
    lat: -1.27972
    lon: 36.81667
    description: >-
      Kenya's oldest university. The main campus sits beside the CBD.
  - name: Strathmore University
    category: education
    lat: -1.31
    lon: 36.81333
    description: >-
      Private university in Madaraka, off Ole Sangale Road.
  - name: USIU-Africa
    category: education
    lat: -1.21806
    lon: 36.8792
    description: >-
      United States International University - Africa, a private university
      off Thika Road.

  # --- Hospitals ----------------------------------------------------------
  - name: Kenyatta National Hospital
    category: health
    lat: -1.30069
    lon: 36.80699
    description: >-
      Kenya's largest public referral and teaching hospital, off Ngong Road.
  - name: Aga Khan University Hospital
    category: health
    lat: -1.26131
    lon: 36.82414
    description: >-
      Private hospital on 3rd Parklands Avenue.
  - name: The Nairobi Hospital
    category: health
    lat: -1.29611
    lon: 36.80472
    description: >-
      Private hospital on Argwings Kodhek Road, in Upper Hill.

  # --- Places of worship --------------------------------------------------
  - name: Jamia Mosque
    category: faith
    lat: -1.28362
    lon: 36.82069
    description: >-
      Nairobi's principal mosque, on Banda Street in the CBD.
  - name: Holy Family Basilica
    category: faith
    lat: -1.2872
    lon: 36.8207
    description: >-
      Roman Catholic cathedral on City Hall Way.
  - name: All Saints Cathedral
    category: faith
    lat: -1.28933
    lon: 36.81344
    description: >-
      Anglican cathedral on Kenyatta Avenue, beside Uhuru Park.

  # --- Sport --------------------------------------------------------------
  - name: Nyayo National Stadium
    category: sport
    lat: -1.30419
    lon: 36.82447
    description: >-
      Stadium where Lang'ata Road meets Mombasa Road.
  - name: Kasarani Stadium
    category: sport
    lat: -1.22806
    lon: 36.89056
    description: >-
      The Moi International Sports Centre, Kenya's largest stadium, off Thika
      Road.
  - name: Ngong Racecourse
    category: sport
    lat: -1.30972
    lon: 36.74306
    description: >-
      Nairobi's horse-racing course, on Ngong Road.

# Place names drawn as labels. Nominatim, checked 22 September 2026, except
