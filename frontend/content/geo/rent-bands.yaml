# =============================================================================
# Indicative rent bands for the map at /map
#
# READ THIS BEFORE TRUSTING THE COLOURS.
#
# Ghana does not publish rent data by district. There is no official index, the
# Rent Control Department does not release figures, and the Ghana Statistical
# Service reports housing expenditure by region rather than by assembly. So
# this is not a survey and it is not measured. It is a coarse five-way ranking
# of typical asking rents, from listing observation and local knowledge, and it
# is here because "where is expensive and where is cheap" is a real question
# that nothing else on the internet answers for Accra in one picture.
#
# What that means in practice:
#
#   * The bands are ordinal. Band 4 is dearer than band 3. It is not twice it.
#   * Deliberately no cedi figures per district. A number would imply a
#     precision that does not exist, and this site does not do that.
#   * Variation WITHIN a district is often larger than the gap between two
#     bands. Ga South holds both Weija and farming villages. `spread: wide`
#     marks the districts where the average is least useful.
#   * `driven_by` names the neighbourhoods that set the band, so a reader can
#     judge the call rather than take it on faith.
#
# Corrections are welcome and are the point of publishing the reasoning:
# https://www.allaboutaccra.com/contact
#
# Run scripts/build_map_data.py after editing this.
# =============================================================================

meta:
  last_verified: 2026-09-08
  fail_on: 2027-03-01
  basis: >-
    Indicative ranking of typical asking rents, from listing observation and
    local knowledge. Not a survey, and not published data - Ghana has none at
    this level.

bands:
  - band: 1
    label: Lowest
    note: Rural and semi-rural. Far below the city median, and far from work.
  - band: 2
    label: Below median
    note: Dense older neighbourhoods and the outer commuter belt.
  - band: 3
    label: Around the median
    note: The bulk of ordinary Accra housing.
  - band: 4
    label: Above median
    note: Established suburbs with newer stock and shorter commutes.
  - band: 5
    label: Highest
    note: Diplomatic and executive Accra. Often quoted in dollars.

districts:
