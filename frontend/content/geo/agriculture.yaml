# What is in season in Nairobi, and where the city's food comes from.
# Hand-kept, compiled for this site on 2026-10-14 from the sources numbered at
# the bottom. Loaded as AGRICULTURE; /seasons renders from it, so a window
# here is the window everywhere.
#
# Nairobi grows little of what it eats. Its food comes in by road from the
# highlands around it, the Rift Valley, the drier east, Lake Victoria and the
# coast, so a season here is the season where the food is grown, as it
# reaches Nairobi's markets.
#
# Every item carries `basis`:
#   sourced  - a named source states the window
#   typical  - the window follows from Kenya's two rainy seasons or general
#              Kenyan crop calendars; no Nairobi-specific source was found
#   unknown  - sources disagree or none was found, and no months are shown
#
# `supply` is the months fresh supply is on or the harvest is in; `year: true`
# means it is on sale all year, and `peak` the months worth singling out.
# Nothing is invented to fill a gap: oranges, pineapple, pawpaw, passion fruit
# and watermelon have no months because the sources contradict each other,
# and the page says so.

meta:
  title: What's in season in Nairobi
  compiled: 2026-10-14
  last_verified: 2026-10-14
  # A year: seasons do not move, but prices and the milk and fish figures do.
  fail_on: 2027-10-14
  caveats:
    - >-
      Windows marked typical come from Kenya's two rainy seasons and general
      Kenyan crop calendars, not from Nairobi market records. Weather moves
      real seasons by weeks, and irrigated crops grow outside them.
    - >-
      Food reaches Nairobi from many counties, each with its own timing:
      mangoes from the coast arrive weeks before Murang'a's, and Makueni
      growers irrigate for off-season fruit. A window here is the main one.
    - >-
      Most of the seasonal detail comes from news reports and farming guides
      rather than official statistics. Where they disagree, the item shows no
      months rather than pick one.
    - >-
      2026 broke several patterns: floods in Mwea and Oloitoktok made tomatoes
      scarce and dear in April, and a cold, dry July and August cut milk
      deliveries. One odd year does not move the calendar, but it is a
      reminder that it is a guide.

