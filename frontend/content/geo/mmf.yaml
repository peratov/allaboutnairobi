# Kenyan money market funds, for the comparer at /tools/mmf-comparer.
#
# yield: the fund's average annual yield for the month in `period`, before the
#   withholding tax on interest and after the manager's fee, from the fund
#   managers' own disclosures as collected in the monthly review cited in
#   `source`. One source for every fund, so they are comparable.
# minimum, top_up, fee, terms: only where the fund's own factsheet, brochure,
#   key information document or website states them, with that in `terms_source`.
#   A blank means we could not confirm it - not that there is none.
# Yields move every week. Update `period`, `checked` and every yield together.

