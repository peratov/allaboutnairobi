landmarks:
- id: black-star-gate
  name: Black Star Gate
  category: monument
  blurb: The Independence Arch at the head of Black Star Square.
  url: /guides/things-to-do-in-accra
  lat: 5.549
  lon: -0.19286
- id: independence-square
  name: Independence Square
  category: monument
  blurb: Black Star Square. Parades, state occasions, and a great deal of open concrete.
  url: /guides/things-to-do-in-accra
  lat: 5.54742
  lon: -0.19256
- id: jamestown-lighthouse
  name: Jamestown Lighthouse
  category: monument
  blurb: The lighthouse over old Accra, and the best view of Ga Mashie and the fishing harbour.
  url: /guides/things-to-do-in-accra
  lat: 5.53309
  lon: -0.21213
- id: kwame-nkrumah-memorial-park
  name: Kwame Nkrumah Memorial Park
  category: monument
  blurb: Nkrumah's mausoleum and museum, on the ground where he declared independence in 1957.
  url: /guides/things-to-do-in-accra
  lat: 5.54474
  lon: -0.20299
- id: osu-castle
  name: Osu Castle
  category: monument
  blurb: Christiansborg. Danish slave fort, then colonial seat, then the seat of government until 2013.
  url: /guides/things-to-do-in-accra
  lat: 5.54742
  lon: -0.18327
- id: ussher-fort
  name: Ussher Fort
  category: monument
  blurb: A 1649 Dutch fort in Ga Mashie, later a colonial prison.
  url: /guides/things-to-do-in-accra
  lat: 5.53834
  lon: -0.20893
- id: accra-metropolitan-assembly
  name: Accra Metropolitan Assembly
  category: government
  blurb: The assembly for central Accra, and one of 29 in the region.
  url: /guides/government-agencies
  lat: 5.5508
  lon: -0.20353
- id: bank-of-ghana
  name: Bank of Ghana
  category: government
  blurb: The central bank. It regulates banks, forex bureaux and mobile money.
  url: /guides/government-agencies
  lat: 5.54311
  lon: -0.20593
- id: ghana-immigration-service
  name: Ghana Immigration Service
  category: government
  blurb: Visas, residence permits and work permits.
  url: /guides/residence-permit
  lat: 5.5708
  lon: -0.19235
- id: jubilee-house
  name: Jubilee House
  category: government
  blurb: The seat of government and the President's office.
  url: /guides/government-agencies
  lat: 5.57972
  lon: -0.18837
- id: parliament-house
  name: Parliament House
  category: government
  blurb: Where Ghana's 276 members of parliament sit.
  url: /guides/government-agencies
  lat: 5.55808
  lon: -0.18997
- id: supreme-court-of-ghana
  name: Supreme Court of Ghana
  category: government
  blurb: The apex court, and the seat of the Judicial Service.
  url: /guides/government-agencies
  lat: 5.5455
  lon: -0.20483
- id: artists-alliance-gallery
  name: Artists Alliance Gallery
  category: culture
  blurb: Three floors of Ghanaian art on the Labadi shore.
  url: /guides/things-to-do-in-accra
  lat: 5.55687
  lon: -0.15613
- id: arts-centre
  name: Arts Centre
  category: culture
  blurb: Crafts, textiles and hard bargaining, near Independence Square.
  url: /guides/where-to-shop-in-accra
  lat: 5.54582
  lon: -0.20199
- id: national-museum-of-ghana
  name: National Museum of Ghana
  category: culture
  blurb: Archaeology, ethnography and art, in a listed 1957 rotunda.
  url: /guides/things-to-do-in-accra
  lat: 5.56074
  lon: -0.20642
- id: national-theatre
  name: National Theatre
  category: culture
  blurb: The sail-shaped 1992 theatre, home to the national dance, drama and symphony companies.
  url: /guides/things-to-do-in-accra
  lat: 5.55367
  lon: -0.20059
- id: nubuke-foundation
  name: Nubuke Foundation
  category: culture
  blurb: Contemporary Ghanaian art, in East Legon.
  url: /guides/things-to-do-in-accra
  lat: 5.63636
  lon: -0.1746
- id: accra-mall
  name: Accra Mall
  category: market
  blurb: The first modern mall in Ghana, at the Tetteh Quarshie interchange.
  url: /guides/where-to-shop-in-accra
  lat: 5.62218
  lon: -0.17294
- id: agbogbloshie
  name: Agbogbloshie
  category: market
  blurb: Scrap, electronics and the Konkomba yam market.
  url: /guides/accra-markets
  lat: 5.55453
  lon: -0.22748
- id: kaneshie-market
  name: Kaneshie Market
  category: market
  blurb: A vast covered market west of the centre, strongest on food.
  url: /guides/accra-markets
  lat: 5.56444
  lon: -0.2343
- id: kantamanto-market
  name: Kantamanto Market
  category: market
  blurb: One of the world's largest second-hand clothing markets.
  url: /guides/where-to-shop-in-accra
  lat: 5.54956
  lon: -0.21345
- id: madina-market
  name: Madina Market
  category: market
  blurb: The market for the northern suburbs, busiest at the weekend.
