rent:
  meta:
    last_verified: '2026-09-08'
    fail_on: '2027-03-01'
    basis: Indicative ranking of typical asking rents, from listing observation and local knowledge. Not
      a survey, and not published data - Ghana has none at this level.
  bands:
  - band: 1
    label: Lowest
    note: Rural and semi-rural. Far below the city median, and far from work.
  - band: 2
    label: Below median
    note: Dense older neighbourhoods and the outer commuter belt.
  - band: 3
    label: Around the median
    note: The bulk of ordinary Accra housing.
  - band: 4
    label: Above median
    note: Established suburbs with newer stock and shorter commutes.
  - band: 5
    label: Highest
    note: Diplomatic and executive Accra. Often quoted in dollars.
census:
  meta:
    generated: '2026-09-08'
    source: Ghana Statistical Service, 2021 Population and Housing Census
    via: StatsBank PxWeb API, statsbank.statsghana.gov.gh
    note: Real census counts at district level. The 2021 census uses the post-2018 districts, so these
      join to the 29 Greater Accra assemblies directly. Percentages are computed here from the counts;
      the counts are as published.
noise:
  meta:
    generated: '2026-09-08'
    what: Inputs for the map's modelled noise layers. Not measured noise and not decibels - nobody publishes
      ambient noise by district for Accra.
    sources:
    - 'Roads and premises: OpenStreetMap contributors, ODbL'
    - 'Population: Ghana Statistical Service, 2021 Population and Housing Census'
    - 'District boundaries and areas: geoBoundaries (gbOpen), CC BY 4.0'
    method: Road length and premises counted within each district and divided by its area. Roads are attributed
      to the district containing their midpoint. The combined layer averages the three quintile ranks
      with equal weight, which introduces no coefficients.
