landmarks:
- id: nairobi-national-park
  name: Nairobi National Park
  category: nature
  description: Kenya's first national park, gazetted in 1946. Lions, rhino and giraffe with the city skyline
    behind them. The main gate is on Lang'ata Road.
  constituency: langata
- id: karura-forest
  name: Karura Forest
  category: nature
  description: Roughly a thousand hectares of urban forest with walking, running and cycling trails and
    a waterfall. Managed by the Kenya Forest Service with Friends of Karura.
  constituency: westlands
- id: uhuru-park
  name: Uhuru Park
  category: nature
  description: Public park on the edge of the CBD, with a boating lake. Central Park is next door.
  constituency: dagoretti-north
- id: nairobi-arboretum
  name: Nairobi Arboretum
  category: nature
  description: A tree park off State House Road, started in 1907 to trial tree species. Popular for picnics
    and early-morning runs.
  constituency: starehe
- id: city-park
  name: City Park
  category: nature
  description: Forested public park between Parklands and Muthaiga, with walking paths and resident monkeys.
  constituency: westlands
- id: ngong-road-forest
  name: Ngong Road Forest
  category: nature
  description: Forest reserve between Ngong Road and Karen, with trails for walking, running and riding.
  constituency: langata
- id: giraffe-centre
  name: Giraffe Centre
  category: nature
  description: Run by the African Fund for Endangered Wildlife. Feed Rothschild's giraffes from a raised
    platform in Lang'ata.
  constituency: langata
- id: sheldrick-wildlife-trust
  name: Sheldrick Wildlife Trust
  category: nature
  description: Orphaned elephant nursery inside Nairobi National Park. Visitors come for a short daily
    viewing; book ahead.
  constituency: langata
- id: nairobi-national-museum
  name: Nairobi National Museum
  category: culture
  description: 'On Museum Hill: Kenyan history, culture, art and natural history, with the Snake Park
    in the same grounds.'
  constituency: starehe
- id: karen-blixen-museum
  name: Karen Blixen Museum
  category: culture
  description: The farmhouse of Karen Blixen, author of Out of Africa, kept as a museum in Karen.
  constituency: langata
- id: bomas-of-kenya
  name: Bomas of Kenya
  category: culture
  description: Traditional homesteads of Kenya's communities and regular dance performances, off Lang'ata
    Road.
  constituency: langata
- id: nairobi-railway-museum
  name: Nairobi Railway Museum
  category: culture
  description: Locomotives and carriages from the Uganda Railway era, beside the central station.
  constituency: starehe
- id: kenya-national-theatre
  name: Kenya National Theatre
  category: culture
  description: Theatre on Harry Thuku Road, next to the University of Nairobi.
  constituency: starehe
- id: kenya-national-archives
  name: Kenya National Archives
  category: culture
  description: National records and a public gallery on Moi Avenue, facing the Hilton.
  constituency: starehe
- id: nairobi-gallery
  name: Nairobi Gallery
  category: culture
  description: Art gallery in the Old PC's Office at the corner of Kenyatta Avenue and Uhuru Highway.
  constituency: starehe
- id: parliament-buildings
  name: Parliament Buildings
  category: government
  description: Seat of the National Assembly and the Senate, on Parliament Road.
  constituency: starehe
- id: kicc
  name: KICC
  category: government
  description: The Kenyatta International Convention Centre. The cylindrical tower that defines the skyline,
    with a rooftop viewing deck.
  constituency: starehe
- id: city-hall
  name: City Hall
  category: government
  description: Seat of the Nairobi City County government, on City Hall Way.
  constituency: starehe
- id: supreme-court
