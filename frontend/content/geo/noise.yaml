meta:
  generated: '2026-09-08'
  what: Inputs for the map's modelled noise layers. Not measured noise and not decibels - nobody publishes
    ambient noise by district for Accra.
  sources:
  - 'Roads and premises: OpenStreetMap contributors, ODbL'
  - 'Population: Ghana Statistical Service, 2021 Population and Housing Census'
  - 'District boundaries and areas: geoBoundaries (gbOpen), CC BY 4.0'
  method: Road length and premises counted within each district and divided by its area. Roads are attributed
    to the district containing their midpoint. The combined layer averages the three quintile ranks with
    equal weight, which introduces no coefficients.
