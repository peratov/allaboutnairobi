# =============================================================================
# Events in Nairobi
#
# Read the note in extensions/context_processors/events.py before adding to
# this file. The short version:
#
#   * Kenya's public holidays are NOT here. They are computed every build, so
#     they roll forward on their own.
#
#   * An event with a `starts` date is shown on that date and disappears by
#     itself the day after it ends. Only a date the organiser has announced
#     gets `starts`.
#
#   * An event that happens every year but whose dates are not yet announced
#     gets `annual: true` and a `when` note, and NO date. Never invent one.
#
#   * `source` and `last_verified` work the way they do in constants.yaml.
#
# Categories: culture, music, tech, business, sport, food, family, civic
# =============================================================================

meta:
  last_reviewed: 2026-09-22
  note: >-
    Curated by hand. Dated listings appear only once an organiser has announced
    them; the public holidays are computed.

events:

  - title: Nairobi International Trade Fair
    annual: true
    when: Usually late September or early October
    venue: Jamhuri Park, off Ngong Road
    area: Nairobi
    category: business
    price: Paid entry
    url: https://ask.co.ke
    description: >-
      The Agricultural Society of Kenya's week-long show: livestock, farm
      machinery, county and company stands, and school trips by the busload.
      Traffic on Ngong Road is heavy all week.
    source: Agricultural Society of Kenya
    last_verified: 2026-09-22

  - title: Safari Rally Kenya
    annual: true
    when: Usually March
    venue: Ceremonial start in Nairobi; stages around Naivasha
    area: Nairobi and Naivasha
    category: sport
    price: Free to watch at most stages
    description: >-
      Kenya's round of the World Rally Championship. The cars are shown off in
      Nairobi before the competitive stages in the Rift Valley, where spectator
      zones fill up early.
    source: World Rally Championship calendar
    last_verified: 2026-09-22

  - title: Magical Kenya Open
    annual: true
    when: Usually February or March
    venue: Held at Nairobi golf clubs in recent years
    area: Nairobi
    category: sport
    price: Paid entry
    description: >-
      Kenya's professional golf open, a DP World Tour event. Check the
      tournament's own site for the year's venue and ticketing.
    source: DP World Tour calendar
    last_verified: 2026-09-22

  - title: Kip Keino Classic
    annual: true
    when: Usually April or May
    venue: Nairobi stadiums
    area: Nairobi
    category: sport
    price: Tickets are usually cheap or free
    description: >-
      A one-day World Athletics Continental Tour meeting named after Kipchoge
      Keino. The best chance in the year to see Kenya's track stars at home.
    source: World Athletics calendar
    last_verified: 2026-09-22

  - title: Africa Tech Summit Nairobi
    annual: true
    when: Usually February
    area: Nairobi
    category: tech
    price: Paid entry
    description: >-
      Two-day conference for founders, investors and the tech companies around
      Nairobi's startup scene.
    source: Organiser listings
    last_verified: 2026-09-22

  - title: Nairobi Restaurant Week
    annual: true
    when: Usually early in the year
    area: Restaurants across Nairobi
    category: food
    price: Set menus at a fixed price
    description: >-
      Participating restaurants offer fixed-price set menus for a week or two.
      Book ahead at the popular ones.
    source: Organiser listings
    last_verified: 2026-09-22

  - title: Nairobi Design Week
    annual: true
    when: Usually in the first half of the year
    area: Venues across Nairobi
    category: culture
    price: Many events free
    description: >-
      Talks, studio visits, markets and exhibitions from Nairobi's designers,
      architects and makers.
    source: Organiser listings
    last_verified: 2026-09-22
