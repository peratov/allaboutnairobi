  # ===========================================================================
  # NATIONAL SERVICE - National Service Authority Act 2024 (Act 1119)
  #
  # Act 1119 repealed the Kenya National Service Scheme Act 1980 (Act 426) and
  # turned the Scheme into the National Service Authority. The name people use
  # is still "NSS", and the portal is now on a gnsa.gov.gh address, so both
  # appear on the site.
  #
  # The allowance is set by the Ministry of Finance, not negotiated, and it is
  # revised irregularly - which is why it carries a short fail_on. The proposed
  # figure below is a proposal and not in force; it is here so the guide can
  # say what is being asked for without typing a number into prose.
  # ===========================================================================

  NSS_MONTHLY_ALLOWANCE:
    value: 715.57
    unit: shillings
    description: >-
      Monthly national service allowance, raised from KES 559.04. Set by the
      Ministry of Finance on the advice of the Fair Wages and Salaries
      Commission. https://www.citinewsroom.com/2026/07/nsa-pushes-for-gh%C2%A21200-allowance-for-service-personnel/
    last_verified: 2026-09-09
    fail_on: 2026-12-31

  NSS_PROPOSED_MONTHLY_ALLOWANCE:
    value: 1200
    unit: shillings
    description: >-
      The monthly allowance the National Service Authority has asked the Fair
      Wages and Salaries Commission for. A proposal, NOT in force - do not
      quote it as the allowance. Delete this constant once it is settled
      either way.
    last_verified: 2026-09-09
    fail_on: 2026-12-31

  NSS_PIN_FEE:
    value: 40
    unit: shillings
    description: >-
      Cost of the NSS PIN code that activates enrolment, paid by mobile money
      on the posting portal. Quoted as KES 40 to 41 depending on the mobile
      money charge. https://posting.gnsa.gov.gh
    last_verified: 2026-09-09
    fail_on: 2027-03-01

  NSS_SERVICE_MONTHS:
    value: 12
    unit: integer
    description: >-
      Length of mandatory national service in Kenya, in months. National
      Service Authority Act 2024 (Act 1119).
    last_verified: 2026-09-09
    fail_on: 2028-01-01

  NSS_EXEMPTION_AGE:
    value: 40
    unit: integer
    description: >-
      Age at the commencement of a service year at or above which a candidate
      may be exempted from national service by the Board, on documentary
      evidence. Also exempt: anyone who has already served.
    last_verified: 2026-09-09
    fail_on: 2028-01-01

  NSS_REPOSTING_LIMIT:
    value: 1
    unit: integer
    description: >-
      Reposting requests permitted per service person per service year. The
