# =============================================================================
# All About Nairobi - site constants
#
# Every number that appears on the website lives here, never hardcoded in a
# guide. This is how All About Berlin keeps 150+ guides consistent when a tax
# band changes, and it matters even more in Kenya, where PAYE bands, the
# minimum wage and ECG tariffs are revised in almost every budget.
#
# Each constant carries provenance:
#   value          the number itself
#   unit           shillings | percent | integer | usd | text
#   description    what it is, and the primary source
#   last_verified  the day a human last checked it against the source
#   fail_on        the day the build starts complaining that it is stale
#
# `mise lint` fails the build when a constant is past its fail_on date, so a
# stale figure becomes a build error instead of a wrong answer on the internet.
# =============================================================================

constants:

