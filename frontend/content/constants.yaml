  # Graphic and Citi Newsroom, quoting its statement of 22 June). The rise was
  # applied uniformly - the lifeline band went 86.90 to 89.93, exactly 3.49% -
  # so 196.8825 x 1.0349 = 203.75 GHp. Energy charge only: the monthly service
  # charge and any levies are on top.
  ECG_RESIDENTIAL_TARIFF_APPROX:
