  STARTUP_POULTRY_500_MIN:
    value: 35000
    unit: shillings
    description: >-
      Cost of starting a 500-bird layer unit near Nairobi, low end. Was 15,000,
      which the arithmetic does not support: 500 pullets eat roughly 6kg each
      before they lay, which is about 60 bags of feed, and the Greater Nairobi
      Poultry Farmers Association lists grower mash at KES 340 and layer mash
      at KES 357 a bag - about KES 21,000 of feed before the first egg is
      sold. Day-old chicks add KES 7,500 to 10,000 at the KES 20 a bird Nairobi
      hatcheries quote. Housing, feeders, drinkers and vaccines are on top.
      https://gapfaKenya.org/current-feed-prices/
    last_verified: 2026-09-10
    fail_on: 2026-12-31

