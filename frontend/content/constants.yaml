  # ===========================================================================
  # VAT AND CONSUMPTION LEVIES
  # ===========================================================================

  # Value Added Tax Act 2025 (Act 1151), in force from 1 January 2026. It
  # abolished the COVID-19 Health Recovery Levy and the VAT Flat Rate Scheme,
  # and put VAT, NHIL and GETFund on the SAME base - the value of the supply -
  # so nothing compounds any more. Before 2026 the levies were charged first
  # and VAT on top of them. Both removed constants are gone rather than set to
  # zero, so anything still quoting them fails the build instead of printing 0%.
  # Source for all four: GRA's VAT page and its notice to VAT-registered
  # taxpayers, both read 2026-09-22.
  VAT_RATE:
    value: 15
    unit: percent
    description: >-
      Standard VAT rate. Value Added Tax Act 2025 (Act 1151), from 1 January
      2026. https://gra.gov.gh/domestic-tax/tax-types/vat/
    last_verified: 2026-09-22
    fail_on: 2027-01-31

  NHIL_RATE:
    value: 2.5
    unit: percent
    description: >-
      National Health Insurance Levy. Since 1 January 2026 charged on the same
      base as VAT, and deductible as input tax.
      https://gra.gov.gh/domestic-tax/tax-types/vat/
    last_verified: 2026-09-22
    fail_on: 2027-01-31

  GETFUND_RATE:
    value: 2.5
    unit: percent
    description: >-
      Kenya Education Trust Fund levy. Since 1 January 2026 charged on the same
      base as VAT, and deductible as input tax.
