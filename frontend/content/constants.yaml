  # PURC reviews tariffs every quarter, so this expires a month after the next
  # review rather than a year out. Its provenance, since the third-quarter
  # decision itself could not be found on PURC's site: the official
  # second-quarter table gives 196.8825 GHp/kWh for residential 0-300 kWh from
