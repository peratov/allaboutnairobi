# =============================================================================
# All About Nairobi - Site Constants
#
# Every number that the templates and guides quote lives here, so a change in
# the law is one edit rather than a hunt through every page.
#
# Each constant carries provenance:
#   value          the number itself
#   unit           shillings | percent | integer | text
#   description    what it is, and the primary source
#   last_verified  the day a human last checked it against the source
#   fail_on        the day it should be re-checked
# =============================================================================

constants:

  # ===========================================================================
  # PAYE - Income Tax Act (Cap. 470), resident individuals, monthly bands.
  # In force since 1 July 2023 (Finance Act 2023). https://www.kra.go.ke
  # ===========================================================================

  PAYE_BAND_1_LIMIT:
    value: 24000
    unit: shillings
    description: The first KES 24,000 of monthly taxable pay is taxed at 10%.
    last_verified: 2026-09-22
    fail_on: 2027-07-01

  PAYE_BAND_2_LIMIT:
    value: 32333
    unit: shillings
    description: KES 24,001 to 32,333 a month is taxed at 25%.
    last_verified: 2026-09-22
    fail_on: 2027-07-01

  PAYE_BAND_3_LIMIT:
    value: 500000
    unit: shillings
    description: KES 32,334 to 500,000 a month is taxed at 30%.
    last_verified: 2026-09-22
    fail_on: 2027-07-01

  PAYE_BAND_4_LIMIT:
    value: 800000
    unit: shillings
    description: KES 500,001 to 800,000 a month is taxed at 32.5%; above that, 35%.
    last_verified: 2026-09-22
    fail_on: 2027-07-01

  PAYE_RATE_1:
    value: 10
    unit: percent
    description: First band.
    last_verified: 2026-09-22
    fail_on: 2027-07-01

  PAYE_RATE_2:
    value: 25
    unit: percent
    description: Second band.
    last_verified: 2026-09-22
    fail_on: 2027-07-01

  PAYE_RATE_3:
    value: 30
    unit: percent
    description: Third band.
    last_verified: 2026-09-22
    fail_on: 2027-07-01

  PAYE_RATE_4:
    value: 32.5
    unit: percent
    description: Fourth band.
    last_verified: 2026-09-22
    fail_on: 2027-07-01

  PAYE_TOP_RATE:
    value: 35
    unit: percent
    description: Monthly taxable pay above KES 800,000.
    last_verified: 2026-09-22
    fail_on: 2027-07-01

  PERSONAL_RELIEF_MONTHLY:
    value: 2400
    unit: shillings
    description: >-
      Personal relief for resident individuals, deducted from the tax
      calculated. KES 28,800 a year.
    last_verified: 2026-09-22
    fail_on: 2027-07-01

  TAX_RETURN_DEADLINE:
    value: 30 June
    unit: text
    description: Individual income tax returns for the previous year are due on iTax by 30 June.
    last_verified: 2026-09-22
    fail_on: 2027-07-01

  # ===========================================================================
  # Statutory deductions
  # ===========================================================================

  NSSF_RATE:
    value: 6
    unit: percent
    description: >-
      NSSF Act 2013. The employee pays 6% of pensionable pay and the employer
      matches it, on pay up to the upper earnings limit.
    last_verified: 2026-09-22
    fail_on: 2027-02-01

  NSSF_LOWER_EARNINGS_LIMIT:
    value: 9000
    unit: shillings
    description: Tier I ceiling from 1 February 2026 (was KES 8,000).
    last_verified: 2026-09-22
    fail_on: 2027-02-01

  NSSF_UPPER_EARNINGS_LIMIT:
    value: 108000
    unit: shillings
    description: Tier II ceiling from 1 February 2026 (was KES 72,000).
    last_verified: 2026-09-22
    fail_on: 2027-02-01

  NSSF_MAX_EMPLOYEE:
    value: 6480
    unit: shillings
    description: >-
      Largest monthly employee contribution: 6% of KES 108,000. The employer
      pays the same again.
    last_verified: 2026-09-22
    fail_on: 2027-02-01

  SHIF_RATE:
    value: 2.75
    unit: percent
    description: >-
      Social Health Insurance Fund contribution, 2.75% of gross pay, run by the
      Social Health Authority (SHA). Replaced NHIF in October 2024.
    last_verified: 2026-09-22
    fail_on: 2027-07-01

  SHIF_MINIMUM:
    value: 300
    unit: shillings
    description: Minimum monthly SHIF contribution.
    last_verified: 2026-09-22
    fail_on: 2027-07-01

  HOUSING_LEVY_RATE:
    value: 1.5
    unit: percent
    description: >-
      Affordable Housing Levy, 1.5% of gross pay from the employee and 1.5%
      from the employer. Affordable Housing Act 2024.
    last_verified: 2026-09-22
    fail_on: 2027-07-01

  VAT_RATE:
    value: 16
    unit: percent
    description: Standard VAT rate. VAT Act 2013.
    last_verified: 2026-09-22
    fail_on: 2027-07-01

  CORPORATE_TAX_RATE:
    value: 30
    unit: percent
    description: Corporation tax for resident companies.
    last_verified: 2026-09-22
    fail_on: 2027-07-01

  # ===========================================================================
  # Work - Employment Act 2007
  # ===========================================================================

  NAIROBI_MIN_WAGE_GENERAL_LABOURER:
    value: 18047
    unit: shillings
    description: >-
      Monthly minimum wage for a general labourer (cleaner, gardener, house
      worker) in Nairobi, Mombasa and Kisumu from 1 May 2026, after a 12% rise.
      Regulation of Wages (General) (Amendment) Order, 2026. Housing
      allowance of 15% is added where housing is not provided.
    last_verified: 2026-09-22
    fail_on: 2027-05-01

  ANNUAL_LEAVE_DAYS:
    value: 21
    unit: integer
    description: Minimum paid annual leave, in working days, after twelve months. Employment Act s.28.
    last_verified: 2026-09-22
    fail_on: 2028-01-01

  MATERNITY_LEAVE_MONTHS:
    value: 3
    unit: integer
    description: Full-pay maternity leave. Employment Act s.29.
    last_verified: 2026-09-22
    fail_on: 2028-01-01

  PATERNITY_LEAVE_WEEKS:
    value: 2
    unit: integer
    description: Full-pay paternity leave. Employment Act s.29.
    last_verified: 2026-09-22
    fail_on: 2028-01-01

  NOTICE_DAYS_MONTHLY_PAID:
    value: 28
    unit: integer
    description: Minimum notice for someone paid monthly, unless the contract gives more. Employment Act s.35.
    last_verified: 2026-09-22
    fail_on: 2028-01-01

  PROBATION_MAX_MONTHS:
    value: 6
    unit: integer
    description: >-
      Maximum probation, which may be extended once by up to six months with
      the employee's agreement. Employment Act s.42.
    last_verified: 2026-09-22
    fail_on: 2028-01-01

  # ===========================================================================
  # Money and phones
  # ===========================================================================

  MPESA_MAX_TRANSACTION:
    value: 250000
    unit: shillings
    description: Largest single M-Pesa transaction for a personal account. Safaricom.
    last_verified: 2026-09-22
    fail_on: 2027-07-01

  MPESA_MAX_DAILY:
    value: 500000
    unit: shillings
    description: Daily M-Pesa transaction limit, and the maximum balance. Safaricom.
    last_verified: 2026-09-22
    fail_on: 2027-07-01

  # ===========================================================================
  # Emergencies
  # ===========================================================================

  EMERGENCY_NUMBER:
    value: "999"
    unit: text
    description: Police, fire and ambulance. 112 also works from any mobile.
    last_verified: 2026-09-22
    fail_on: 2028-01-01

  RED_CROSS_EMERGENCY:
    value: "1199"
    unit: text
    description: Kenya Red Cross emergency line, toll free.
    last_verified: 2026-09-22
    fail_on: 2028-01-01

  # ===========================================================================
  # Business and property
  # ===========================================================================

  VAT_REGISTRATION_THRESHOLD:
    value: 8000000
    unit: shillings
    description: >-
      Annual turnover above which VAT registration is compulsory, raised from
      KES 5 million by the Finance Act 2024 with effect from 1 September 2024.
    last_verified: 2026-09-23
    fail_on: 2027-07-01

  TURNOVER_TAX_RATE:
    value: 3
    unit: percent
    description: Turnover tax on the gross sales of small resident businesses below the VAT threshold.
    last_verified: 2026-09-23
    fail_on: 2027-07-01

  BUSINESS_NAME_FEE:
    value: 950
    unit: shillings
    description: Business Registration Service fee to search and register a business name on eCitizen.
    last_verified: 2026-09-23
    fail_on: 2027-07-01

  STAMP_DUTY_URBAN:
    value: 4
    unit: percent
    description: Stamp duty on transfers of property in cities, municipalities and gazetted towns, including all of Nairobi.
    last_verified: 2026-09-23
    fail_on: 2027-07-01

  STAMP_DUTY_RURAL:
    value: 2
    unit: percent
    description: Stamp duty on transfers of rural land.
    last_verified: 2026-09-23
    fail_on: 2027-07-01

  HOUSING_ALLOWANCE_RATE:
    value: 15
    unit: percent
    description: >-
      Housing allowance an employer must pay on top of basic minimum wage when
      it does not provide housing. Regulation of Wages (General) Order.
    last_verified: 2026-09-23
    fail_on: 2027-05-01

  MRI_RATE:
    value: 7.5
    unit: percent
    description: >-
      Monthly residential rental income tax for resident landlords, on gross
      rent, final tax. KRA gives 7.5% from 1 January 2024. The Finance Bill 2026
      proposed 10%; check KRA before filing.
    last_verified: 2026-09-23
    fail_on: 2027-01-01

  MRI_LOWER_LIMIT:
    value: 280000
    unit: shillings
    description: Annual gross residential rent above which the monthly rental income regime applies, per KRA.
    last_verified: 2026-09-23
    fail_on: 2027-07-01

  MRI_UPPER_LIMIT:
    value: 15000000
    unit: shillings
    description: Annual gross residential rent above which landlords file under the ordinary income tax rules instead.
    last_verified: 2026-09-23
    fail_on: 2027-07-01

  NONRESIDENT_RENT_TAX_RATE:
    value: 30
    unit: percent
    description: Non-resident rental income tax on gross rent, introduced by the Finance Act 2026 from 1 July 2026.
    last_verified: 2026-09-23
    fail_on: 2027-07-01

  CAR_IMPORT_DUTY_RATE:
    value: 25
    unit: percent
    description: Import duty on passenger cars, on the customs value. Calculators and KRA disagree at the margins; KRA's assessment decides.
    last_verified: 2026-09-23
    fail_on: 2027-07-01

  CAR_IDF_RATE:
    value: 3.5
    unit: percent
    description: Import Declaration Fee, on the customs value.
    last_verified: 2026-09-23
    fail_on: 2027-07-01

  CAR_RDL_RATE:
    value: 2
    unit: percent
    description: Railway Development Levy, on the customs value.
    last_verified: 2026-09-23
    fail_on: 2027-07-01

  SEVERANCE_DAYS_PER_YEAR:
    value: 15
    unit: integer
    description: Minimum severance on redundancy, in days' pay per completed year of service. Employment Act s.40.
    last_verified: 2026-09-23
    fail_on: 2028-01-01

  MARRIAGE_NOTICE_DAYS:
    value: 21
    unit: integer
    description: Days a notice of intended civil marriage is published before the marriage can take place. Marriage Act 2014.
    last_verified: 2026-09-23
    fail_on: 2028-01-01

  INTEREST_WHT_RATE:
    value: 15
    unit: percent
    description: >-
      Withholding tax on interest paid to resident individuals from money market
      funds, bank deposits, Treasury bills and most bonds. Final tax.
      Infrastructure bonds are exempt.
    last_verified: 2026-09-23
    fail_on: 2027-07-01

  NORMAL_WEEKLY_HOURS:
    value: 52
    unit: integer
    description: Normal working week under the Regulation of Wages (General) Order, 60 for night workers.
    last_verified: 2026-09-23
    fail_on: 2028-01-01

  OVERTIME_RATE_NORMAL:
    value: 1.5
    unit: decimal
    description: Overtime multiple on ordinary working days, general wage regulations.
    last_verified: 2026-09-23
    fail_on: 2028-01-01

  OVERTIME_RATE_REST_DAY:
    value: 2
    unit: decimal
    description: Overtime multiple on rest days and public holidays, general wage regulations.
    last_verified: 2026-09-23
    fail_on: 2028-01-01

  DIGITAL_NOMAD_MIN_INCOME_USD:
    value: 24000
    unit: integer
    description: Minimum annual income from outside Kenya for a Class N digital nomad permit, as reported in 2026.
    last_verified: 2026-09-23
    fail_on: 2027-07-01
