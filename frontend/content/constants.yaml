# =============================================================================
# All About Nairobi - Site Constants
#
# Every number that the templates and guides quote lives here, so a change in
# the law is one edit rather than a hunt through every page.
#
# Each constant carries provenance:
#   value          the number itself
#   unit           shillings | percent | integer | text
#   description    what it is, and the primary source
#   last_verified  the day a human last checked it against the source
#   fail_on        the day it should be re-checked
# =============================================================================

constants:

