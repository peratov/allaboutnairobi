  # ===========================================================================
  # BOOKS AND READING
  #
  # Nobody publishes a Kenyaian book price index, and the two ends of this
  # market barely touch: an imported paperback is priced off a dollar landed
  # cost plus duty, while a pavement copy of the same title is priced off what
  # the seller paid for a bale. Both figures below are observation of Nairobi
  # shelves rather than a survey, and they carry short fail_on dates for that
  # reason. School booklists are a household budget line and are the thing
  # readers most often ask about, so they are here too.
  # ===========================================================================

