    last_verified: 2026-09-09
    fail_on: 2027-06-01

  # ===========================================================================
  # STARTING A SMALL BUSINESS
  #
  # Checked against real Kenyaian prices in September 2026, and the check
  # changed things. Where a figure has a source it is named in the description.
  #
  # What survived: shop rents against Jiji listings, salon and sewing equipment
  # against Jiji, container prices against Jiji.
  #
  # What did not: the 500-bird poultry figures were far too low, because feed
  # to point of lay alone is about KES 21,000 at the poultry association's own
  # listed prices. They roughly doubled.
  #
  # What still cannot be checked: the whole-setup figures for most trades,
  # because nobody publishes what it costs to open a barbershop; and the
  # assembly permit fees, which are set by fee-fixing resolutions that are not
  # online. Those say so in their own descriptions and keep a short fail_on.
  #
  # They are deliberately whole-setup figures - equipment, the first stock, the
  # rent advance and the paperwork - because that is the number that decides
  # whether somebody can start, and quoting equipment alone understates it by
  # more than half.
  # ===========================================================================

  SMALL_SHOP_RENT_MONTHLY_MIN:
    value: 180
    unit: shillings
    description: >-
      Monthly rent for a small shop, a single room or a kiosk in an ordinary
      Nairobi neighbourhood, low end. Checked against shop listings on
      jiji.com.gh, where Greater Nairobi shops start around this figure -
      usually on a two-year commitment. The rent advance a landlord asks for
      is the larger obstacle.
    last_verified: 2026-09-10
    fail_on: 2027-03-01

  SMALL_SHOP_RENT_MONTHLY_MAX:
    value: 2500
    unit: shillings
    description: >-
      Monthly rent for a small shop in a busy or well-off area, high end.
      Matches real Nairobi shop listings on jiji.com.gh - Dome at 2,500, Ofankor
      Barrier at 2,000, Awoshie at 835. A unit in a mall or on a main road in
      Osu or East Legon runs well above this.
    last_verified: 2026-09-10
    fail_on: 2027-03-01

