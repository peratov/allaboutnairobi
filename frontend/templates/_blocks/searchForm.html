<form
	class="search-form"
	role="search"
	action="{{ SITE_URL }}/search"
	method="get"
	data-search-form>
	<label class="visually-hidden" for="site-search">Search {{ SITE_NAME }}</label>
	<input
		id="site-search"
		type="search"
		name="q"
		placeholder="Search guides and glossary"
		autocomplete="off"
		spellcheck="false"
		data-search-input>

	{#
		type="submit" on purpose: it submits to /search, where there is a
		full-width field with autofocus and the results, so search works the same
		with scripts off.
	#}
	<button type="submit" aria-label="Search" data-search-button>
		{% include "_icons/search.svg" %}
	</button>
</form>
